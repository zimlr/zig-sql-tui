name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local
      TMPDIR: ${{ github.workspace }}/.zig-cache/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision Zig 0.17.1
        run: |
          mkdir -p tools/zig .zig-cache/download "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR" "$TMPDIR"
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen

          url = 'https://registry.npmjs.org/@zigpm/zig-linux-x64/-/zig-linux-x64-0.17.1.tgz'
          path = Path('.zig-cache/download/zig.tgz')
          with urlopen(url) as response, path.open('wb') as out:
              while chunk := response.read(1024 * 1024):
                  out.write(chunk)
          expected = 'fa23b02630bf478a588e66aa049236e1f5b0d920e7a84dc7979400ac3eee6346'
          package = path.read_bytes()
          if hashlib.sha256(package).hexdigest() != expected:
              raise SystemExit('Zig package SHA-256 mismatch')
          expected_sha512 = 'FR5JZ38wPdEbpr11l61ToM7IapXyBFlBbAiLTk7SQb6YPNCbRoEmYnZ27mARIhTWo1muIgA6eXNnM7dEGDSDgQ=='
          if base64.b64encode(hashlib.sha512(package).digest()).decode() != expected_sha512:
              raise SystemExit('Zig package SHA-512 mismatch')
          PY
          tar -xzf .zig-cache/download/zig.tgz -C tools/zig --strip-components=1
          echo '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  tools/zig/zig.tar.xz' | sha256sum -c
          tar -xJf tools/zig/zig.tar.xz -C tools/zig --strip-components=1
          test "$(./tools/zig/zig version)" = 0.17.1
      - name: Verify vendored SQLite
        run: sha256sum -c vendor/sqlite/SHA256SUMS
      - name: Check project prose
        run: python3 tools/check_prose.py
      - name: Check formatting
        run: ./tools/zig/zig fmt --check build.zig src/main.zig tests/*.zig tools/*.zig
      - name: Build x86_64
        run: ./tools/zig/zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true
      - name: Run tests
        run: |
          ./tools/zig/zig build test -Doptimize=ReleaseSmall
          ZSQT_AUDIT_EXE=zig-out/bin/zsqt ./tools/zig/zig test tests/test_syscalls.zig vendor/sqlite/sqlite3.c -O ReleaseSmall -lc
      - name: Build aarch64
        run: ./tools/zig/zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true --prefix .zig-cache/arm-output
      - name: Build and test diagnostics
        run: |
          ./tools/zig/zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true --prefix .zig-cache/debug-x86
          ZSQT_TEST_EXE="$PWD/zig-out/bin/zsqt" ZSQT_DEBUG_EXE="$PWD/.zig-cache/debug-x86/bin/zsqt" ./tools/zig/zig test tests/test_diagnostics.zig -O ReleaseSmall -lc
          ./tools/zig/zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true --prefix .zig-cache/debug-arm
          mkdir -p .zig-cache/debug-package .zig-cache/debug-transfer
          cp .zig-cache/debug-arm/bin/zsqt .zig-cache/debug-package/zsqt-debug
          chmod +x .zig-cache/debug-package/zsqt-debug
          tar -czf .zig-cache/debug-transfer/zsqt-android-arm64-debug.tar.gz -C .zig-cache/debug-package zsqt-debug
          (cd .zig-cache/debug-transfer && sha256sum zsqt-android-arm64-debug.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termux-debug-aarch64
          path: .zig-cache/debug-transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Check static linkage
        run: |
          for binary in zig-out/bin/zsqt .zig-cache/arm-output/bin/zsqt .zig-cache/debug-x86/bin/zsqt .zig-cache/debug-arm/bin/zsqt; do
            header=$(readelf -h "$binary")
            programs=$(readelf -l "$binary")
            dynamic=$(readelf -d "$binary")
            grep -E 'Type:[[:space:]]+DYN' <<< "$header"
            if grep -q INTERP <<< "$programs"; then exit 1; fi
            if grep -q '(NEEDED)' <<< "$dynamic"; then exit 1; fi
          done
      - name: Prepare aarch64 test artifact
        run: |
          mkdir -p .zig-cache/arm-transfer
          cp .zig-cache/arm-output/bin/zsqt .zig-cache/arm-transfer/
          ./tools/zig/zig test tests/test_termux_probe.zig -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/termux-probe-test
          ./tools/zig/zig build-exe tools/check_termux_candidate.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc -femit-bin=.zig-cache/arm-transfer/check-termux-candidate
          ./tools/zig/zig test tests/test_termux_tool.zig -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/termux-tool-test
          ./tools/zig/zig test tests/test_release_policy.zig -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/release-policy-test
          ./tools/zig/zig test tests/test_diagnostics.zig -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/diagnostics-test
          ./tools/zig/zig test tests/test_pointer_navigation.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/pointer-navigation-test
          ./tools/zig/zig test tests/test_global_search.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/global-search-test
          ./tools/zig/zig test tests/test_without_rowid.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/without-rowid-test
          ./tools/zig/zig test tests/test_paging.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/paging-test
          ./tools/zig/zig test tests/test_live_audit.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/live-audit-test
          ./tools/zig/zig test tests/test_app.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/app-test
          ./tools/zig/zig test tests/test_recovery.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/recovery-test
          ./tools/zig/zig test tests/test_wal_write.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/wal-write-test
          ./tools/zig/zig test tests/test_termux_restrictions.zig vendor/sqlite/sqlite3.c -target aarch64-linux-musl -O ReleaseSmall -lc --test-no-exec -femit-bin=.zig-cache/arm-transfer/termux-restrictions-test
          cd .zig-cache/arm-transfer
          sha256sum zsqt termux-probe-test check-termux-candidate termux-tool-test release-policy-test diagnostics-test pointer-navigation-test global-search-test without-rowid-test paging-test live-audit-test app-test recovery-test wal-write-test termux-restrictions-test > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-linux-musl-test
          path: .zig-cache/arm-transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-aarch64-linux:
    needs: build-and-test
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-linux-musl-test
          path: zig-out/bin
      - name: Test aarch64 Linux binary
        run: |
          test "$(uname -m)" = aarch64
          (cd zig-out/bin && sha256sum -c SHA256SUMS)
          chmod +x zig-out/bin/zsqt zig-out/bin/termux-probe-test zig-out/bin/pointer-navigation-test zig-out/bin/global-search-test zig-out/bin/without-rowid-test zig-out/bin/paging-test zig-out/bin/live-audit-test zig-out/bin/app-test zig-out/bin/recovery-test zig-out/bin/wal-write-test zig-out/bin/release-policy-test zig-out/bin/diagnostics-test zig-out/bin/termux-restrictions-test zig-out/bin/check-termux-candidate zig-out/bin/termux-tool-test
          mkdir -p .zig-cache/tmp
          ZSQT_TERMUX_PROBE=zig-out/bin/check-termux-candidate ./zig-out/bin/termux-probe-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ZSQT_TERMUX_PROBE=zig-out/bin/check-termux-candidate ./zig-out/bin/termux-tool-test
          ./zig-out/bin/release-policy-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/diagnostics-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/pointer-navigation-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/global-search-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/without-rowid-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/paging-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/live-audit-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/app-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/recovery-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/wal-write-test
          ZSQT_TEST_EXE=zig-out/bin/zsqt ./zig-out/bin/termux-restrictions-test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termux-debug-aarch64
          path: .zig-cache/debug-transfer
      - name: Test aarch64 diagnostics
        run: |
          (cd .zig-cache/debug-transfer && sha256sum -c SHA256SUMS)
          mkdir -p .zig-cache/debug-native
          tar -xzf .zig-cache/debug-transfer/zsqt-android-arm64-debug.tar.gz -C .zig-cache/debug-native
          ZSQT_TEST_EXE="$PWD/zig-out/bin/zsqt" ZSQT_DEBUG_EXE="$PWD/.zig-cache/debug-native/zsqt-debug" ./zig-out/bin/diagnostics-test
