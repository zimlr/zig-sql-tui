name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/local
      TMPDIR: ${{ github.workspace }}/.zig-cache/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision Zig 0.17.1
        run: |
          mkdir -p tools/zig .zig-cache/download "$ZIG_GLOBAL_CACHE_DIR" "$ZIG_LOCAL_CACHE_DIR" "$TMPDIR"
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen

          url = 'https://registry.npmjs.org/@zigpm/zig-linux-x64/-/zig-linux-x64-0.17.1.tgz'
          path = Path('.zig-cache/download/zig.tgz')
          with urlopen(url) as response, path.open('wb') as out:
              while chunk := response.read(1024 * 1024):
                  out.write(chunk)
          expected = 'fa23b02630bf478a588e66aa049236e1f5b0d920e7a84dc7979400ac3eee6346'
          package = path.read_bytes()
          if hashlib.sha256(package).hexdigest() != expected:
              raise SystemExit('Zig package SHA-256 mismatch')
          expected_sha512 = 'FR5JZ38wPdEbpr11l61ToM7IapXyBFlBbAiLTk7SQb6YPNCbRoEmYnZ27mARIhTWo1muIgA6eXNnM7dEGDSDgQ=='
          if base64.b64encode(hashlib.sha512(package).digest()).decode() != expected_sha512:
              raise SystemExit('Zig package SHA-512 mismatch')
          PY
          tar -xzf .zig-cache/download/zig.tgz -C tools/zig --strip-components=1
          echo '3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  tools/zig/zig.tar.xz' | sha256sum -c
          tar -xJf tools/zig/zig.tar.xz -C tools/zig --strip-components=1
          test "$(./tools/zig/zig version)" = 0.17.1
      - name: Verify vendored SQLite
        run: sha256sum -c vendor/sqlite/SHA256SUMS
      - name: Check project prose
        run: python3 tools/check_prose.py
      - name: Check formatting
        run: ./tools/zig/zig fmt --check build.zig src/main.zig
      - name: Build x86_64
        run: ./tools/zig/zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true
      - name: Run tests
        run: |
          ./tools/zig/zig build test -Doptimize=ReleaseSmall
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build aarch64
        run: ./tools/zig/zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true --prefix .zig-cache/arm-output
      - name: Check static linkage
        run: |
          for binary in zig-out/bin/zig-sql-tui .zig-cache/arm-output/bin/zig-sql-tui; do
            header=$(readelf -h "$binary")
            programs=$(readelf -l "$binary")
            dynamic=$(readelf -d "$binary")
            grep -E 'Type:[[:space:]]+DYN' <<< "$header"
            if grep -q INTERP <<< "$programs"; then exit 1; fi
            if grep -q '(NEEDED)' <<< "$dynamic"; then exit 1; fi
          done
      - name: Prepare aarch64 test artifact
        run: |
          mkdir -p .zig-cache/arm-transfer
          cp .zig-cache/arm-output/bin/zig-sql-tui .zig-cache/arm-transfer/
          cd .zig-cache/arm-transfer
          sha256sum zig-sql-tui > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aarch64-linux-musl-test
          path: .zig-cache/arm-transfer/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test-aarch64-linux:
    needs: build-and-test
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aarch64-linux-musl-test
          path: zig-out/bin
      - name: Test aarch64 Linux binary
        run: |
          test "$(uname -m)" = aarch64
          (cd zig-out/bin && sha256sum -c SHA256SUMS)
          chmod +x zig-out/bin/zig-sql-tui
          mkdir -p .zig-cache/tmp
          python3 -m unittest discover -s tests -p 'test_*.py' -v
